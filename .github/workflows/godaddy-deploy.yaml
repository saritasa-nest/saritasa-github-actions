---
name: Deploy to GoDaddy environment

# Reusable workflow to deploy a WordPress codebase to a GoDaddy Web Hosting
# (cPanel) account using SSH + rsync.
#
# Prerequisites on the GoDaddy side:
#   - SSH access enabled for the cPanel user
#     (cPanel -> SSH Access -> Manage SSH Keys -> import the public key
#      paired with `godaddy_ssh_key`, then "Authorize")
#   - The remote target directory exists (typically `~/public_html` for the
#     primary domain or `~/public_html/<addon-domain>` for addon domains)

on:
  workflow_call:
    inputs:
      environment_name:
        description: Human-readable name of the environment (used in Slack notifications)
        required: true
        type: string
      jira_key:
        description: JIRA key of the project
        required: true
        type: string
      godaddy_host:
        description: SSH host of the GoDaddy server (e.g. `1.2.3.4` or `hostname.secureserver.net`)
        required: true
        type: string
      godaddy_user:
        description: SSH/cPanel username on the GoDaddy server
        required: true
        type: string
      godaddy_port:
        description: SSH port on the GoDaddy server
        default: 22
        required: false
        type: number
      remote_path:
        description: Absolute path on the GoDaddy server to deploy into (e.g. `/home/user/public_html`)
        required: true
        type: string
      source_path:
        description: Path inside the repo to deploy from (trailing slash means "contents of"). Defaults to repo root.
        default: ./
        required: false
        type: string
      rsync_extra_flags:
        description: Additional rsync flags (typically extra --exclude entries)
        default: --exclude=.*
        required: false
        type: string
      backup_retention:
        description: How many remote backup archives to keep before pruning the oldest
        default: 10
        required: false
        type: number
      backup_remote_path:
        description: |
          Absolute path on the GoDaddy server to store backup archives.
          If left empty, defaults to `/home/<godaddy_user>/backups`.
        default: ''
        required: false
        type: string
    secrets:
      slack_webhook_url:
        required: true
        description: Slack webhook url to send notifications to channel
      godaddy_ssh_key:
        required: true
        description: Private SSH key authorized on the GoDaddy cPanel account
      godaddy_ssh_known_hosts:
        required: false
        description: |
          Output of `ssh-keyscan -p <port> <host>` for the GoDaddy server. If omitted,
          the workflow falls back to scanning the host at runtime (less secure).

jobs:
  backup:
    runs-on: saritasa-rocks-eks
    outputs:
      backup_archive: ${{ steps.backup.outputs.backup_archive }}
    steps:
      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.godaddy_ssh_key }}

      - name: Configure known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [[ -n "${{ secrets.godaddy_ssh_known_hosts }}" ]]; then
            echo "${{ secrets.godaddy_ssh_known_hosts }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p ${{ inputs.godaddy_port }} -H ${{ inputs.godaddy_host }} >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Create remote backup of current files
        id: backup
        run: |
          set -euo pipefail
          TS="$(date -u +%Y-%m-%d-%H%M%SZ)"
          ARCHIVE="${TS}-${{ inputs.environment_name }}-backup.tar.gz"
          # SSH command strings, so fall back to /home/<user>/backups.
          REMOTE_BACKUP_DIR='${{ inputs.backup_remote_path }}'
          if [[ -z "$REMOTE_BACKUP_DIR" ]]; then
            REMOTE_BACKUP_DIR='/home/${{ inputs.godaddy_user }}/backups'
          fi
          REMOTE_TARGET='${{ inputs.remote_path }}'

          ssh -p ${{ inputs.godaddy_port }} \
              ${{ inputs.godaddy_user }}@${{ inputs.godaddy_host }} \
              "set -euo pipefail; \
               mkdir -p \"$REMOTE_BACKUP_DIR\"; \
               if [ ! -d \"$REMOTE_TARGET\" ]; then \
                 echo 'Remote target $REMOTE_TARGET does not exist, skipping backup'; \
                 exit 0; \
               fi; \
               tar -czf \"$REMOTE_BACKUP_DIR/$ARCHIVE\" -C \"$(dirname "$REMOTE_TARGET")\" \"$(basename "$REMOTE_TARGET")\"; \
               echo \"Created backup: $REMOTE_BACKUP_DIR/$ARCHIVE\"; \
               ls -1t \"$REMOTE_BACKUP_DIR\"/*-${{ inputs.environment_name }}-backup.tar.gz 2>/dev/null \
                 | tail -n +$((${{ inputs.backup_retention }} + 1)) \
                 | xargs -r rm -f; \
               echo 'Pruned old backups, retained ${{ inputs.backup_retention }} most recent'"

          echo "backup_archive=${REMOTE_BACKUP_DIR}/${ARCHIVE}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: backup
    runs-on: saritasa-rocks-eks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.godaddy_ssh_key }}

      - name: Configure known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [[ -n "${{ secrets.godaddy_ssh_known_hosts }}" ]]; then
            echo "${{ secrets.godaddy_ssh_known_hosts }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p ${{ inputs.godaddy_port }} -H ${{ inputs.godaddy_host }} >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy with rsync
        # FLAGS for `rsync`:
        # -a - archive (recursion + permissions + symlinks + timestamps)
        # -z - compress file data
        # -v - verbose
        # -r - recursive
        # --inplace - update files in-place without creating temporary copies
        # --delete - delete files in the destination that no longer exist in the source
        # --exclude=.* - exclude dotfiles and dotfolders (extendable via rsync_extra_flags)
        run: |
          rsync -azvr --inplace --delete ${{ inputs.rsync_extra_flags }} \
            -e "ssh -p ${{ inputs.godaddy_port }}" \
            "${{ inputs.source_path }}" \
            "${{ inputs.godaddy_user }}@${{ inputs.godaddy_host }}:${{ inputs.remote_path }}"

  send-notifications:
    needs: deploy
    if: always()
    runs-on: saritasa-rocks-eks
    steps:
      - name: Prepare notification
        id: prepare
        run: |
          ENVIRONMENT="*${{ inputs.environment_name }}*"
          COMMIT="$(echo "${{ github.event.head_commit.message }}" | sed "s/[\`,\",']//g" | tr '\n' ' ')"
          REPO_NAME="${{ github.event.repository.name }}"
          AUTHOR_NAME="[$REPO_NAME] by ${{ github.event.head_commit.author.name }}"
          AUTHOR_LINK="https://github.com/${{ github.actor }}"
          BRANCH="${{ github.ref_name }}"
          SHA_SHORT=${GITHUB_SHA:0:7}
          REVISION="<${{ github.server_url }}/${{ github.repository }}/commit/$SHA_SHORT|$SHA_SHORT>"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          JIRA_URL="https://saritasa.atlassian.net/browse/${{ inputs.jira_key }}"
          MANAGE="<$REPO_URL|Github> | <$REPO_URL/issues|Issues> | <$JIRA_URL|Jira> | <$REPO_URL/actions/runs/${{ github.run_id }}|CI/CD>"

          echo "env=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "author_name=$AUTHOR_NAME" >> $GITHUB_OUTPUT
          echo "author_link=$AUTHOR_LINK" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "revision=$REVISION" >> $GITHUB_OUTPUT
          echo "manage=$MANAGE" >> $GITHUB_OUTPUT

      - name: Notify about success
        if: needs.deploy.result == 'success'
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.slack_webhook_url }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "",
              "attachments": [
                {
                    "color": "2eb886",
                    "text": "The latest changes to ${{ steps.prepare.outputs.env }} have been deployed successfully",
                    "title": "${{ steps.prepare.outputs.commit }}",
                    "author_name": "${{ steps.prepare.outputs.author_name }}",
                    "author_link": "${{ steps.prepare.outputs.author_link }}",
                    "footer": "Github Actions",
                    "fields": [
                        {
                            "value": "${{ steps.prepare.outputs.branch }}",
                            "title": "Branch",
                            "short": true
                        },
                        {
                            "value": "${{ steps.prepare.outputs.revision }}",
                            "title": "Revision",
                            "short": true
                        },
                        {
                            "value": "${{ steps.prepare.outputs.manage }}",
                            "title": "Manage",
                            "short": false
                        }
                    ],
                    "mrkdwn_in": [
                        "pretext",
                        "text"
                    ]
                }
              ]
            }

      - name: Notify about failure
        if: needs.deploy.result != 'success'
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.slack_webhook_url }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "",
              "attachments": [
                {
                    "color": "a30200",
                    "text": "The latest changes to ${{ steps.prepare.outputs.env }} failed to deploy",
                    "title": "${{ steps.prepare.outputs.commit }}",
                    "author_name": "${{ steps.prepare.outputs.author_name }}",
                    "author_link": "${{ steps.prepare.outputs.author_link }}",
                    "footer": "Github Actions",
                    "fields": [
                        {
                            "value": "${{ steps.prepare.outputs.branch }}",
                            "title": "Branch",
                            "short": true
                        },
                        {
                            "value": "${{ steps.prepare.outputs.revision }}",
                            "title": "Revision",
                            "short": true
                        },
                        {
                            "value": "${{ steps.prepare.outputs.manage }}",
                            "title": "Manage",
                            "short": false
                        }
                    ],
                    "mrkdwn_in": [
                        "pretext",
                        "text"
                    ]
                }
              ]
            }
