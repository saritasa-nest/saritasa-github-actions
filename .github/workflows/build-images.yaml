name: build-images

# Builds and publishes OCI images for changed Dockerfiles in a pull request
#
# The workflow determines target environments from `build:<environment>` PR labels, builds
# each changed Dockerfile for the selected environments, publishes the resulting images,
# reports build results in the pull request, and adds the `auto-merge` label when all
# image builds succeed

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      base_registry:
        description: OCI registry hostname for authenticated base image pulls
        type: string
        required: false
        default: docker.io
      github_token_login:
        description: |
          Controls whether authentication to GitHub Container Registry using the job's GITHUB_TOKEN is enabled,
          can be used together with other registry authentication options
          To pull private images, the following is required:
            1. `packages: read` permission
            2. repository running the workflow must have `Read` access to the image
          Actions access can be managed in image settings:
            https://github.com/orgs/<org-name>/packages/container/<image-name>/settings
        type: boolean
        required: false
        default: false
    secrets:
      base_registry_username:
        required: false
      base_registry_password:
        required: false
      base_registries_auth:
        required: false
      slack_webhook_url:
        required: true

permissions:
  actions: read
  contents: read
  # to login to aws with oidc
  # https://github.com/aws-actions/configure-aws-credentials#oidc
  id-token: write
  # to be able to add an `auto-merge` label to pr
  issues: write
  # to check which files have been changed in pr and create pr comments
  pull-requests: write
  # to be able to pull private ghcr.io images
  packages: read

concurrency:
  group: build-images-${{ github.event.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  prepare-input-data:
    runs-on: ${{ inputs.runner }}
    outputs:
      matrix: ${{ steps.data.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Get changed Dockerfiles
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files: |
            **/Dockerfile
            **/*.Dockerfile
      - name: Extract environments from labels and prepare matrix values
        id: data
        shell: bash
        run: |
          set -euo pipefail
          # extract environments from pr labels
          # the result will be an array like "dev prod"
          environments=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" | grep '^build:' | sed 's/^build://')

          # extract the paths to all changed Dockerfiles and add them to the `matrix` variable,
          # which looks like this:
          # {
          #   "include": [
          #     {"environment": "dev", "context": "buildpacks/backend/builder", "dockerfile": "Dockerfile"},
          #     {"environment": "dev", "context": "buildpacks/backend/runner", "dockerfile": "Dockerfile"},
          #     {"environment": "prod", "context": "buildpacks/backend/builder", "dockerfile": "Dockerfile"},
          #     {"environment": "prod", "context": "buildpacks/backend/runner", "dockerfile": "Dockerfile"}
          #   ]
          # }
          matrix='{"include":[]}'
          modified_files="${{ steps.changed-files.outputs.all_changed_and_modified_files }}"
          for env in ${environments[@]}; do
            for file in ${modified_files[@]}; do
              context=$(dirname "${file}")
              dockerfile=$(basename "${file}")
              # add a new element to the matrix with the received relative path to the Dockerfile
              # for each environment
              matrix=$(echo "${matrix}" | jq \
                --arg context "${context}" \
                --arg env "${env}" \
                --arg dockerfile "${dockerfile}" \
                '.include += [{"environment": $env, "context": $context, "dockerfile": $dockerfile}]')
            done
          done
          echo "matrix=$(echo ${matrix} | jq -c .)"
          echo "matrix=$(echo ${matrix} | jq -c .)" >> $GITHUB_OUTPUT

  build-images:
    runs-on: ${{ inputs.runner }}
    if: ${{ needs.prepare-input-data.outputs.matrix != '[]' }}
    needs:
      - prepare-input-data
    strategy:
      matrix: ${{ fromJson(needs.prepare-input-data.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build and publish an image for ${{ matrix.context }}
        uses: $/.github/actions/build-image
        with:
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          base_registry: ${{ inputs.base_registry }}
          base_registry_username: ${{ secrets.base_registry_username }}
          base_registry_password: ${{ secrets.base_registry_password }}
          base_registries_auth: ${{ secrets.base_registries_auth }}
          github_token_login: ${{ inputs.github_token_login }}
          environment: ${{ matrix.environment }}
          slack_webhook_url: ${{ secrets.slack_webhook_url }}

  create-pr-comment:
    runs-on: ${{ inputs.runner }}
    if: ${{ !cancelled() && needs.build-images.result != 'skipped' }}
    needs:
      - build-images
      - prepare-input-data
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Checkout PR comment template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/actions/build-image/pr-comment-template.j2
          path: pr-comment-template
          sparse-checkout-cone-mode: false
      - name: Download data artifacts data for the PR comment template
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          merge-multiple: true
          path: pr-comment-data
          pattern: '!*.dockerbuild'
      - name: Create common file with vars for the jinja template
        shell: bash
        run: |
          set -euo pipefail
          jq -s \
            --arg author "${{ github.event.sender.login }}" \
            --arg link "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg status "${{ needs.build-images.result }}" '
              {
                author: $author,
                images: map(.images) | add,
                link: $link,
                status: $status
              }
          ' pr-comment-data/*.json > pr-comment-data.json
      - name: Generate PR comment from jinja template
        uses: cuchi/jinja2-action@8bd801365a8d36a0b20f45ee969161685de7785a  # v1.3.0
        with:
          data_file: pr-comment-data.json
          template: pr-comment-template/.github/actions/build-image/pr-comment-template.j2
          output_file: pr-comment.md
      - name: Find build-images comment
        id: find-comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad  # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: '<!-- saritasa-build-images -->'
      - name: Create or update build-images comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9  # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body-path: pr-comment.md
          edit-mode: append

  add-auto-merge-label:
    runs-on: ${{ inputs.runner }}
    if: ${{ !cancelled() && needs.build-images.result == 'success' }}
    needs:
      - build-images
      - create-pr-comment
    steps:
      - name: Add auto-merge label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['auto-merge'],
            })
