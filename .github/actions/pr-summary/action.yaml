---
name: pr-summary
description: |
  GitHub Action for automatic generation of pull request summaries using OpenAI.
  Key features:
  - Analyzes PR changes using AI
  - Automatically links to JIRA issues from commit messages
  - Generates structured Markdown with change analysis
  - Updates PR description with the generated summary
  The action processes all changes in the PR, analyzes them with OpenAI,
  and updates the PR description with a clean, readable summary.

inputs:
  github-token:
    description: GitHub token
    required: true
  jira-url:
    description: base url for Jira
    required: false
    default: https://saritasa.atlassian.net
  openai-api-key:
    description: openai api key for PR summary generation
    required: true
  openai-model:
    description: openai model to use for PR summary generation
    required: false
    default: gpt-5
  openai-prompt:
    description: The prompt template to use for OpenAI
    required: false
    default: >-
      You are helping to generate a Pull Request summary that teammates will read.
      The goal is to describe what was done and why it matters, in a neutral and factual way.

      Guidelines:
      - Focus on the overall purpose, impact, and outcomes of the changes.
        Think in terms of features, fixes, improvements, integrations, or workflow changes.
      - Ignore trivial or mechanical edits (e.g. .terraform-version, .terraform.lock.hcl,
        version bumps, config alignment, boilerplate replacements, formatting changes).
      - Ignore any changes to README.md and CHANGELOG.md files completely.
      - Do not list changes per file. Do not mention file names explicitly.
      - Group related changes together and capture them as one bullet point.
      - Keep the summary concise: 1–3 bullet points, or one short paragraph if it reads better.
      - Use only neutral, descriptive wording. Do not include subjective qualifiers or judgments
        (e.g. avoid words like "first-class", "improved", "robust", "reliable", "important").
      - Ignore formatting or typo fixes.

      Changed files:
      {all_files}

      Code changes:
      {code_changes}

      Available PR labels (use ONLY these exact values, do not invent new ones): {available_labels}

      Label selection rules:
      - `env=X`: pick based on environment indicators — folder names, environment-specific
        value files, or config directories.
      - `c/X` or `c/X/Y`: component label — assign when the PR modifies that component's
        own codebase. A pipeline or CI configuration dedicated to a specific component
        (e.g. autotests pipeline) should also get that component's label.
      - `p/X` or `p/X/Y`: platform label — assign when the PR modifies that platform's
        own codebase.
      - `tooling`: assign for changes to CI/CD workflow files (.github/workflows/),
        .pre-commit configs, or similar dev tooling files within a repository.
      - `p/github`: assign when the PR modifies the GitHub platform infrastructure
        (IAM roles for GitHub Actions, OIDC federation, GitHub Apps Terraform).
        Do NOT assign `p/github` for workflow or dev tooling changes — those are `tooling`.

      CRITICAL: assign a `p/` or `c/` label ONLY when the PR directly modifies that
      platform/component ITSELF — not when the PR merely USES or REFERENCES it.

      Examples of when NOT to assign a label:
      - Creating a ScaledObject inside another component → do NOT assign `p/keda`
      - Creating an ArgoCD Application to deploy something → do NOT assign `p/argocd`
      - Adding a Karpenter NodePool inside a pipeline chart → do NOT assign `p/karpenter`
      - Referencing Selenium Grid in a test pipeline → do NOT assign `p/selenium-grid`
      - Referencing Replicator resources → do NOT assign `p/replicator`

      When multiple `p/X/Y` sub-labels exist, assign one only if the changed files are
      in that sub-label's own directory. Do not pick a sub-label by keyword similarity.

      Only include labels that exist exactly in the list above. If no labels match, use an empty list.

      Respond ONLY with valid YAML in this exact format, no extra text:
      summary: |
        - bullet point 1
        - bullet point 2
      labels:
        - label1
        - label2
  mcp-server-git-version:
    description: Version of mcp-server-git to use (e.g. 2026.7.10)
    required: false
    default: 2026.7.10
  mcp-server-git-constraints:
    description: Dependency constraints for mcp-server-git uvx environment (e.g. mcp<2)
    required: false
    default: mcp>=2
  pr-number:
    description: PR number to update with the generated summary
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install openai-agents uv PyGithub pyyaml

    - name: Install latest gh CLI
      uses: sersoft-gmbh/setup-gh-cli-action@v3
      with:
        version: stable

    - name: Install yq
      uses: dcarbone/install-yq-action@v1.3.1 

    - name: Generate PR summary
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        REPO_PATH: ${{ github.workspace }}
        REPOSITORY: ${{ github.repository }}
        OPENAI_PROMPT: ${{ inputs.openai-prompt }}
        MCP_SERVER_GIT_VERSION: ${{ inputs.mcp-server-git-version }}
        MCP_SERVER_GIT_CONSTRAINTS: ${{ inputs.mcp-server-git-constraints }}
      run: |
        set -euo pipefail
        # sample /tmp/ai_output.yaml:
        #
        # labels:
        # - env=dev
        # - p/github
        # summary: '- Added pr-summary GitHub Action that generates PR descriptions using OpenAI
        #
        #   - Automatically extracts context from changed files
        #
        #   '
        python ${{ github.action_path }}/pr-summary-generator.py \
          --jira-url "${{ inputs.jira-url }}" \
          --model "${{ inputs.openai-model }}" \
          --pr-number "${{ inputs.pr-number }}" \
          --output-file /tmp/ai_output.yaml

    - name: Apply labels from AI output
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        labels=$(yq -r '.labels[]' /tmp/ai_output.yaml | paste -sd "," -)
        if [ -n "$labels" ]; then
          gh pr edit ${{ inputs.pr-number }} --add-label "$labels"
        fi
